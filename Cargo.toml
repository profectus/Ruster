[package]
name = "ruster"
version = "0.4.0"
edition = "2021"
description = "Ruster"

[dependencies]
flate2 = "1.0"
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
libc = "0.2"
objc = "0.2"
sevenz-rust = "0.6"
tar = "0.4"
unrar = "0.5"
zip = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
