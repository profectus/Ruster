[package]
name = "ruster"
version = "0.4.6"
edition = "2021"
description = "Ruster"

[dependencies]
flate2 = "1.0"
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
libc = "0.2"
objc = "0.2"
regex = "1.10"
sevenz-rust = { version = "0.6", features = ["aes256"] }
tar = "0.4"
unrar = "0.5"
zip = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
